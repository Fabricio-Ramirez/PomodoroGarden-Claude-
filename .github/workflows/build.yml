name: Build

# Builds PomodoroGarden.exe on Windows and runs the tests for every push and pull request.
# Publishes a GitHub Release when the version in src/Program.cs changes on main or
# main-embdfr (and it isn't released yet), or when a tag like v2.1.0 is pushed.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        shell: cmd
        run: build.cmd

      - name: Run the tests
        shell: cmd
        run: |
          set CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist release mkdir release
          "%CSC%" /nologo /target:exe /main:PomodoroGarden.DevTool /out:release\devtool.exe ^
            /r:System.Windows.Forms.dll /r:System.Drawing.dll ^
            src\*.cs tools\DevTool.cs || exit /b 1
          release\devtool.exe cycle || exit /b 1
          del release\devtool.exe

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroGarden
          path: release/PomodoroGarden.exe

  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-embdfr')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -oP 'AssemblyVersion\("\K[0-9]+\.[0-9]+\.[0-9]+' src/Program.cs)"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag is already released, nothing to do"
              exit 0
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Release notes: the "What's new" section of the README.
          awk '/^## /{if (on) exit} /^## What.s new/{on=1; next} on' README.md > notes.md

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.tag != ''
        with:
          name: PomodoroGarden

      - name: Publish the release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pomodoro Garden ${{ steps.tag.outputs.tag }}
          body_path: notes.md
          files: PomodoroGarden.exe
          make_latest: true
