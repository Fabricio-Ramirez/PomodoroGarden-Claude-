name: Build

# Builds PomodoroGarden.exe on Windows for every push and pull request.
# Pushing a tag like v1.2.0 also publishes the .exe as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        shell: cmd
        run: build.cmd

      - name: Run the timer-rules test
        shell: cmd
        run: |
          set CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist release mkdir release
          "%CSC%" /nologo /target:exe /main:PomodoroGarden.DevTool /out:release\devtool.exe ^
            /r:System.Windows.Forms.dll /r:System.Drawing.dll ^
            src\*.cs tools\DevTool.cs || exit /b 1
          release\devtool.exe cycle || exit /b 1
          del release\devtool.exe

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroGarden
          path: release/PomodoroGarden.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PomodoroGarden

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: PomodoroGarden.exe
          generate_release_notes: true
